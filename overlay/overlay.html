<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>海斗速查 · 悬浮窗</title>
<style>
  :root{
    --bg:#0A0E18;
    --panel:rgba(17,22,36,.72);
    --line:rgba(255,255,255,.075);
    --line-gold:rgba(240,193,91,.26);
    --gold:#F0C15B;
    --gold-light:#FFE4A8;
    --text:#F3EFE4;
    --muted:#9AA2B5;
    --dim:#6A7285;
    --green:#57D98A;
    --red:#EF6A6A;
    --violet:#8F7BFF;
    --cyan:#5FD4E8;
    --font:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    --num:"Bahnschrift","DIN Alternate","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;background:transparent;color:var(--text);font-family:var(--font);font-size:12px;
    -webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;
  }
  .win{
    height:100%;display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,rgba(16,21,33,.94),rgba(8,11,18,.96));
    border:1px solid rgba(240,193,91,.25);border-radius:16px;
    box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
    position:relative;
  }
  .win::before{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:16px;
    background:radial-gradient(320px 160px at 88% -8%,rgba(240,193,91,.14),transparent 70%);
  }
  body.pinned .win{border-color:rgba(240,193,91,.5);outline:1px dashed rgba(240,193,91,.35);outline-offset:-5px}

  .bar{
    -webkit-app-region:drag;display:flex;align-items:center;gap:7px;
    height:38px;padding:0 9px 0 12px;border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.02);flex:0 0 auto;position:relative;z-index:2;
  }
  .mark{width:16px;height:16px;color:var(--gold);flex:0 0 auto}
  .mark svg{width:100%;height:100%;fill:currentColor}
  .title{font-size:12px;font-weight:700;letter-spacing:.04em}
  .bar .ver{font-family:var(--num);font-size:9px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:14px}
  .actions{margin-left:auto;display:flex;gap:4px;-webkit-app-region:no-drag}
  .act{
    width:24px;height:24px;border-radius:6px;border:1px solid transparent;color:var(--dim);
    display:grid;place-items:center;cursor:pointer;background:none;padding:0;
    transition:color .15s,background .15s,border-color .15s;
  }
  .act:hover{color:var(--text);background:rgba(255,255,255,.05);border-color:var(--line)}
  .act svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .act.active{color:var(--gold);border-color:var(--line-gold);background:rgba(240,193,91,.1)}
  .act.close:hover{color:#fff;background:rgba(220,70,70,.75);border-color:transparent}

  .statusbar{
    display:flex;align-items:center;gap:6px;padding:7px 13px 0;font-size:10px;color:var(--muted);
    flex:0 0 auto;
  }
  .dot{width:5px;height:5px;border-radius:50%;background:var(--dim);flex:0 0 auto}
  .dot.live{background:var(--green);box-shadow:0 0 7px rgba(87,217,138,.9)}
  .dot.demo{background:var(--gold);box-shadow:0 0 7px rgba(240,193,91,.7)}
  .statusbar .clock{margin-left:auto;font-family:var(--num);color:var(--dim);letter-spacing:.04em}

  main{flex:1 1 auto;overflow:auto;padding:8px 12px 10px;position:relative;z-index:1}
  main::-webkit-scrollbar{width:4px}
  main::-webkit-scrollbar-thumb{background:#283044;border-radius:99px}

  .champ{
    position:relative;overflow:hidden;border-radius:11px;border:1px solid var(--line);
    min-height:88px;padding:12px;display:flex;align-items:flex-end;gap:10px;background:#0A0E17;
  }
  .champ .splash{
    position:absolute;inset:0;background-size:cover;background-position:center 22%;
    opacity:.5;transition:opacity .4s;
  }
  .champ::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(7,10,17,.95) 10%,rgba(7,10,17,.72) 55%,rgba(7,10,17,.28) 100%),
      linear-gradient(0deg,rgba(7,10,17,.92) 2%,transparent 65%);
  }
  .champ > *{position:relative;z-index:1}
  .avatar{width:42px;height:42px;border-radius:10px;border:1px solid rgba(240,193,91,.45);object-fit:cover;background:#0A0E16;flex:0 0 auto}
  .champ-info{min-width:0}
  .champ-name{font-size:19px;font-weight:800;line-height:1.15;letter-spacing:.02em}
  .champ-sub{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden}
  .tier{font-family:var(--num);font-weight:700;letter-spacing:.04em}
  .tier.t1{color:#F0C15B}.tier.t2{color:#5FD4E8}.tier.t3{color:#7FA6FF}.tier.t4{color:#A78BFA}.tier.t5{color:#8A90A0}
  .champ-wr{margin-left:auto;text-align:right;flex:0 0 auto}
  .champ-wr b{display:block;font-family:var(--num);font-size:19px;line-height:1;color:var(--green)}
  .champ-wr span{font-size:9px;color:var(--dim)}

  .block{margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
  .block-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:9px;letter-spacing:.12em;color:var(--dim);font-weight:600;margin-bottom:4px}
  .block-h .right{font-family:var(--num);letter-spacing:.02em;color:var(--dim);font-weight:400}
  .rec{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:11.5px}
  .g{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-family:var(--num);font-size:10.5px;font-weight:700;flex:0 0 auto;border:1px solid currentColor}
  .g.S{color:#F0C15B;background:rgba(240,193,91,.1)}
  .g.A{color:#5FD4E8;background:rgba(95,212,232,.08)}
  .g.B{color:#7FA6FF;background:rgba(127,166,255,.08)}
  .g.C{color:#8A90A0;background:rgba(138,144,160,.08)}
  .rec .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
  .rec .rar{font-size:8.5px;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:0 3px;margin-left:3px}
  .rec .p{font-family:var(--num);font-size:10px;color:var(--muted);width:34px;text-align:right;flex:0 0 auto}
  .rec .bar{width:44px;height:2.5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;flex:0 0 auto}
  .rec .bar i{display:block;height:100%;background:linear-gradient(90deg,#C08E33,#F0C15B);border-radius:99px}

  .items{display:flex;gap:5px;margin-top:3px}
  .item{
    width:33px;height:33px;border-radius:7px;border:1px solid var(--line);background:#0A0E16;
    overflow:hidden;position:relative;flex:0 0 auto;
  }
  .item.core{border-color:rgba(240,193,91,.48)}
  .item.core::after{content:"";position:absolute;right:2px;bottom:2px;width:3px;height:3px;border-radius:50%;background:var(--gold);box-shadow:0 0 5px var(--gold)}
  .item img{width:100%;height:100%;object-fit:cover;display:block}
  .item-names{font-size:9.5px;color:var(--dim);margin-top:6px;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .notice{
    margin-top:8px;padding:7px 9px;border-radius:8px;border:1px solid rgba(240,193,91,.22);
    background:rgba(240,193,91,.06);font-size:10px;line-height:1.6;color:var(--muted);
  }
  .notice b{color:var(--gold-light);font-weight:600}

  footer{flex:0 0 auto;border-top:1px solid var(--line);background:rgba(0,0,0,.22);padding:7px 12px 8px}
  .demo-row{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--dim)}
  .demo-row select{
    flex:1;height:25px;background:#131A29;color:var(--muted);border:1px solid var(--line);
    border-radius:6px;font-family:var(--font);font-size:10.5px;padding:0 6px;outline:none;
  }
  .demo-row select:disabled{opacity:.55}
  .hints{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:9px;color:var(--dim)}
  .hints .spacer{margin-left:auto;font-family:var(--num)}
  .hints kbd{
    font-family:var(--num);font-size:8.5px;border:1px solid var(--line);border-radius:3px;
    padding:0 3px;background:rgba(255,255,255,.03);color:var(--dim);
  }
</style>
</head>
<body>
<div class="win">
  <header class="bar">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 40 40"><path d="M20 3 34 11v18L20 37 6 29V11Z" opacity=".9"/><path d="M20 10l2.4 6.1L28.5 19l-6.1 2.4L20 27.5l-2.4-6.1L11.5 19l6.1-2.4z" fill="#0A0E18"/></svg>
    </span>
    <span class="title">海斗速查</span>
    <span class="ver" id="ver">16.21</span>
    <div class="actions">
      <button class="act" id="btn-pin" type="button" title="点击穿透 (Ctrl+Shift+L)">
        <svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 3v2H6v-2l4-3z"/><path d="M12 15v5"/></svg>
      </button>
      <button class="act" id="btn-web" type="button" title="打开网页速查 (Ctrl+Shift+O)">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8"/><path d="M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"/></svg>
      </button>
      <button class="act" id="btn-hide" type="button" title="隐藏 (Ctrl+Shift+H)">
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
      </button>
      <button class="act close" id="btn-close" type="button" title="退出">
        <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </header>

  <div class="statusbar">
    <i class="dot" id="dot"></i>
    <span id="status-text">演示模式 · 未检测到对局</span>
    <span class="clock" id="clock">--:--</span>
  </div>

  <main>
    <section class="champ">
      <div class="splash" id="splash"></div>
      <img class="avatar" id="avatar" alt="" onerror="this.style.opacity=0">
      <div class="champ-info">
        <div class="champ-name" id="champ-name">阿狸</div>
        <div class="champ-sub"><span class="tier t1" id="champ-tier">T1</span><span id="champ-arch">法师</span><span>·</span><span id="champ-title">九尾妖狐</span></div>
      </div>
      <div class="champ-wr"><b id="champ-wr">52.8%</b><span>海斗胜率</span></div>
    </section>

    <div class="notice" id="notice" hidden></div>

    <section class="block">
      <div class="block-h"><span>海克斯优先级</span><span class="right">选取率</span></div>
      <div id="recs"></div>
    </section>

    <section class="block">
      <div class="block-h"><span>推荐出装 · <span id="build-name">爆发流</span></span><span class="right" id="skill-order">Q &gt; W &gt; E</span></div>
      <div class="items" id="items"></div>
      <div class="item-names" id="item-names"></div>
    </section>
  </main>

  <footer>
    <div class="demo-row">
      <span id="demo-label">演示英雄</span>
      <select id="demo-select" aria-label="选择演示英雄"></select>
    </div>
    <div class="hints">
      <span><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>H</kbd> 隐藏</span>
      <span><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>L</kbd> 穿透</span>
      <span class="spacer" id="foot-patch">16.21.1 · 演示数据</span>
    </div>
  </footer>
</div>

<script src="../web/data/data.js"></script>
<script src="overlay.js"></script>
</body>
</html>
